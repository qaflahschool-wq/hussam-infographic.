name: Worker security tests

on:
  push:
    branches:
      - "work/**"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/index.js
      - run: node --check scripts/build.mjs
      - run: npm run build
      - run: npm test
