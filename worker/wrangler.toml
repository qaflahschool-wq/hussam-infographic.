name = "hussam-ai-api"
main = "src/index.js"
compatibility_date = "2026-05-03"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/health", "/v1/*"]

[vars]
ENVIRONMENT = "development"
DEV_AUTH_BYPASS = "true"
ALLOWED_ORIGINS = "http://localhost:8787,http://127.0.0.1:8787"
GEMINI_MODEL = "gemini-2.5-flash"

[[d1_databases]]
binding = "DB"
database_name = "hussam-infographic-dev"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[env.production]
name = "hussam-ai-api"
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
DEV_AUTH_BYPASS = "false"
GEMINI_MODEL = "gemini-2.5-flash"
ALLOWED_ORIGINS = "https://hussam-ai-api.alshakliamohammed04.workers.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "hussam-infographic-prod"
database_id = "REPLACE_WITH_APPROVED_D1_DATABASE_ID"
migrations_dir = "migrations"
