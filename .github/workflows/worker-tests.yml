name: Worker security tests

on:
  push:
    branches:
      - "work/**"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/index.js
      - run: node --check scripts/build.mjs
      - run: npm run build
      - run: npm test
      - name: Apply D1 migrations to the local emulator
        run: npx --yes wrangler@4 d1 migrations apply hussam-infographic-dev --local
      - name: Configure local-only bootstrap secret
        run: printf 'ADMIN_BOOTSTRAP_TOKEN=ci-bootstrap-token-which-is-long-enough-2026\\n' > .dev.vars
      - name: Start the local Worker
        run: npx --yes wrangler@4 dev --ip 127.0.0.1 --port 8787 > /tmp/hussam-wrangler.log 2>&1 &
      - name: Wait for the Worker and run integration smoke tests
        run: |
          for i in {1..45}; do
            if curl --silent --fail http://127.0.0.1:8787/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8787/health
          node tests/smoke-local.mjs
