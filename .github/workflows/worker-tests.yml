name: Worker security tests

on:
  push:
    branches:
      - "work/**"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/index.js
      - run: node --check scripts/build.mjs
      - run: npm run build
      - run: npm test
      - name: Apply D1 migrations to the local emulator
        run: npx --yes wrangler@4.165.0 d1 migrations apply hussam-infographic-dev --local
      - name: Configure local-only bootstrap secret
        run: printf 'ADMIN_BOOTSTRAP_TOKEN=ci-bootstrap-token-which-is-long-enough-2026\n' > .dev.vars
      - name: Start Worker and run local integration smoke tests
        run: |
          npx --yes wrangler@4.165.0 dev --ip 127.0.0.1 --port 8787 > /tmp/hussam-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..45}; do
            if curl --silent --fail http://127.0.0.1:8787/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/hussam-wrangler.log
            exit 1
          fi
          curl --silent --fail http://127.0.0.1:8787/health
          node tests/smoke-local.mjs
      - name: Package the deployable application
        run: |
          cd ..
          zip -r worker/HUSSAM-INFOGRAPHIC-DEPLOYMENT.zip worker/src worker/migrations worker/scripts worker/public worker/wrangler.toml worker/package.json worker/SETUP.md worker/README.md worker/security.js index.html
      - uses: actions/upload-artifact@v4
        with:
          name: HUSSAM-INFOGRAPHIC-DEPLOYMENT
          path: worker/HUSSAM-INFOGRAPHIC-DEPLOYMENT.zip
          if-no-files-found: error
          retention-days: 14
